<?xml version="1.0" encoding="UTF-8"?>
<!--
    plantillaBase.xhtml — Esqueleto común de SIVIDO.
    Inserciones: metadata (f:metadata), titulo, encabezado (zona derecha), left (menú lateral) y content.
    Parámetros: sinMenu=true (sin columna de menú), claseContenido (CSS; si no viene, depende de sinMenu).
-->
<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <!-- Punto de inserción para <f:metadata> (f:viewParam / f:viewAction) de las vistas.
         Uso en la vista: <ui:define name="metadata"><f:metadata>...</f:metadata></ui:define> -->
    <ui:insert name="metadata"/>
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title><ui:insert name="titulo">SIVIDO</ui:insert></title>
        <!-- Facet "last": nuestros CSS cargan después de los de PrimeFaces para sobrescribirlos; <link> directo
             porque h:outputStylesheet se reubica con los recursos de PrimeFaces y quedaría antes. -->
        <f:facet name="last">
            <!-- sivido-tema.css reemplaza a estilos.css, layout.css y primefaces-cets.css (rediseño «Editorial»):
                 tokens, layout y sobrescritura del tema saga de PrimeFaces. -->
            <link rel="stylesheet" href="#{resource['css:sivido-tema.css']}"/>
        </f:facet>
    </h:head>
    <h:body>
        <header id="top">
            <h:link outcome="/vista/publico/index" styleClass="marca">
                <span class="marca-icono"><i class="pi pi-heart-fill"></i></span>
                <span class="marca-texto">
                    <span class="marca-nombre">SIVIDO</span>
                    <span class="marca-sub">Centro Estatal de la Transfusión Sanguínea · Oaxaca</span>
                </span>
            </h:link>
            <div class="encabezado-derecha">
                <ui:insert name="encabezado"/>
            </div>
            <!-- Línea de pulso decorativa en el borde inferior del encabezado -->
            <svg class="ecg-encabezado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 14" preserveAspectRatio="none" aria-hidden="true">
                <polyline fill="none" stroke="#d0102a" stroke-width="1.6" stroke-linejoin="round"
                          points="0,12 300,12 318,12 326,3 334,13 342,1 350,12 760,12 778,12 786,4 794,13 802,2 810,12 1280,12"/>
            </svg>
        </header>

        <div class="cuerpo">
            <!-- Columna del menú: se oculta si la plantilla hija manda sinMenu=true -->
            <ui:fragment rendered="#{not sinMenu}">
                <aside id="left">
                    <ui:insert name="left"/>
                </aside>
            </ui:fragment>

            <main id="content" class="#{not empty claseContenido ? claseContenido : (sinMenu ? 'sin-menu' : 'con-menu')}">
                <ui:insert name="content">Contenido</ui:insert>
            </main>
        </div>

        <footer id="pie">
            <span>SIVIDO · CETS Oaxaca</span>
            <span class="pie-lema">Dona sangre<b>·</b>Dona esperanza<b>·</b>Dona vida</span>
        </footer>
    </h:body>
</html>
